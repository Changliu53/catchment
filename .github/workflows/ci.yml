# Tests and deploys, in that order.
#
# Vercel's own Git integration is deliberately not connected. It ties "which
# Vercel account is this?" to the GitHub user who pushed, which breaks the
# moment that GitHub user points at a different Vercel account — and it
# deployed whether or not the tests passed. Here the deploy is an ordinary job
# authenticated by a token, so it depends on nothing but `needs: test`.
#
# That ordering is the point: a commit that breaks the map is red before it is
# ever served.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight; there is no reason to finish testing
# a commit nobody will look at again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned. An unattended `@latest` means a CLI release can turn a green pipeline
# red on a commit that changed nothing.
env:
  VERCEL_CLI: vercel@59.23.2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Accounts and saved analyses are the one part of this app that cannot be
    # tested against a fixture: the claim is that a WHERE clause keeps one
    # person out of another's rows, and only a real database can refuse a
    # query. Plain Postgres, not PostGIS — the geometry never comes near this
    # one; it holds sessions and saved questions.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      # The committed SQL, applied in order to an empty database. A migration
      # that only works where the table already exists fails here rather than
      # in production.
      - name: Migrate
        run: npm run db:migrate

      # The authorization tests skip themselves without DATABASE_URL, which is
      # exactly how a suite quietly stops testing anything. They refuse to skip
      # when CI is set, so a missing service container fails the run here
      # rather than passing it — see `saved.integration.test.ts`.
      - name: Unit and integration
        run: npm test

      # Only Chromium, and only its dependencies. The suite asserts about
      # WebGL rendering and worker packaging, neither of which differs
      # usefully across engines; three browsers would triple the minutes to
      # test the same thing.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Deliberately without DATABASE_URL: this is the "clone it and run it"
      # path, where the analysis works from the sampled dataset and accounts
      # are simply absent. If that path breaks, the repository stops being
      # runnable by anyone who does not already have a database.
      - name: End-to-end
        run: npm run test:e2e
        env:
          DATABASE_URL: ''

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ----------------------------------------------------------------- pipeline --
  # The Python pipeline, which until now CI never touched.
  #
  # That gap had a cost and it was nearly paid: a Dependabot pull request
  # bumping pandas, pyproj and psycopg collected three green checks that were
  # all about the JavaScript, and one of those bumps made the pipeline
  # uninstallable on Python 3.11. A check that reports success about something
  # it never looked at is the failure this repository keeps finding in its own
  # tooling, and this is the last place it was still true.
  #
  # It does not gate the deploy: the pipeline is not part of what ships, it is
  # what produced the data that already shipped. It does turn the run red,
  # which is the point.
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          # The floor requirements.txt states, not the newest available. A
          # dependency that quietly needs something newer should fail here.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      - name: Smoke
        run: python pipeline/smoke.py

  # ---------------------------------------------------------------- preview --
  preview:
    needs: test
    # Two ways the secrets go missing, and the job has to sit out both or it
    # reports a fault that is not one.
    #
    # A pull request from a fork gets no repository secrets, which is the
    # obvious one. A pull request opened by Dependabot also gets none — its
    # branch lives in this repository, so the fork check passes, but GitHub
    # runs it against a separate Dependabot secret store on purpose, and
    # `secrets.VERCEL_TOKEN` comes through empty. That turned every dependency
    # update red at the deploy step while its tests were green, which is the
    # precise way to teach someone to stop reading CI.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      # No `vercel build` here: Vercel builds remotely, which is what gives the
      # deployment the project's own environment variables. DATABASE_URL and
      # ANTHROPIC_API_KEY stay in the Vercel project and are never copied into
      # GitHub.
      - name: Deploy preview
        id: deploy
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # One comment, edited in place. A new comment per push buries the
      # conversation under a list of dead URLs.
      - name: Comment the preview URL
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- preview-url -->';
            const body = `${marker}\nPreview for \`${context.sha.slice(0, 7)}\`: ${{ steps.deploy.outputs.url }}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # ------------------------------------------------------------- production --
  production:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Deploy production
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
